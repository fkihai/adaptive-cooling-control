# Generated by tools/build_floor1_packages.py; edit LT2 rules or this builder.
input_boolean:
  ac_lt1_left_control_enabled:
    name: AC LT1 Left control
  ac_lt1_right_control_enabled:
    name: AC LT1 Right control
input_datetime:
  ac_lt1_left_last_command:
    name: AC LT1 Left sent at
    has_date: true
    has_time: true
  ac_lt1_left_last_manual:
    name: AC LT1 Left manual at
    has_date: true
    has_time: true
  ac_lt1_right_last_command:
    name: AC LT1 Right sent at
    has_date: true
    has_time: true
  ac_lt1_right_last_manual:
    name: AC LT1 Right manual at
    has_date: true
    has_time: true
input_text:
  ac_lt1_left_last_applied:
    name: AC LT1 Left sent
    max: 100
  ac_lt1_right_last_applied:
    name: AC LT1 Right sent
    max: 100
template:
- variables:
    units:
      left:
        climate: climate.ac_lg_lt_1_kiri
        power: sensor.0x60b763fffe1e5fc6_power
        switch: input_boolean.ac_lt1_left_control_enabled
        last_command: input_datetime.ac_lt1_left_last_command
        last_manual: input_datetime.ac_lt1_left_last_manual
        last_applied: input_text.ac_lt1_left_last_applied
        setting: sensor.ac_lt1_left_recommended_setting
      right:
        climate: climate.ac_lg_lt_1_kanan
        power: sensor.0x60b763fffe1e380d_power
        switch: input_boolean.ac_lt1_right_control_enabled
        last_command: input_datetime.ac_lt1_right_last_command
        last_manual: input_datetime.ac_lt1_right_last_manual
        last_applied: input_text.ac_lt1_right_last_applied
        setting: sensor.ac_lt1_right_recommended_setting
  sensor:
  - name: AC LT1 Left status
    unique_id: ac_lt1_left_status
    default_entity_id: sensor.ac_lt1_left_status
    state: "{% set u = units.left %} {% set rec = states(u.setting) %} {% set rt = rec.split('|')[0] |\
      \ int(0) %} {% set rf = rec.split('|')[1] if '|' in rec else '' %} {% set t = state_attr(u.climate,\
      \ 'temperature') | int(0) %} {% set f = state_attr(u.climate, 'fan_mode') %} {% set now_ts = now().timestamp()\
      \ %} {% set manual_until = (state_attr(u.last_manual, 'timestamp') | float(0)) + 60 * 60 %} {% set\
      \ last_cmd = (state_attr(u.last_command, 'timestamp') | float(0)) %} {% if is_state(u.climate, 'off')\
      \ %}\n  AC mati, tidak diatur otomasi\n{% elif not is_state(u.climate, 'cool') %}\n  Mode bukan\
      \ Cool, tidak diatur otomasi\n{% elif rt == 0 or (rt == t and rf == f) %}\n  ok\n{% elif now_ts\
      \ < manual_until %}\n  Dijeda manual s/d {{ manual_until | timestamp_custom('%H:%M') }}\n{% elif\
      \ not is_state(u.switch, 'on') %}\n  Otomasi mati · saran {{ rt }} °C · {{ rf }}\n{% elif not is_state('schedule.ac_lt1_hours',\
      \ 'on') %}\n  Di luar jam kerja\n{% elif not is_state('input_boolean.ac_adaptive_count_lt1_enabled',\
      \ 'on') %}\n  Hitung orang mati\n{% elif not is_state('binary_sensor.ac_lt1_occupied', 'on')\n \
      \       or is_state('binary_sensor.ac_lt1_count_stale', 'on') %}\n  Menunggu hitungan orang\n{%\
      \ elif not (has_value(u.power)\n             and states(u.power) | float(0) > 50\n             and\
      \ (now_ts - as_timestamp(states[u.power].last_reported, 0)) < 20 * 60) %}\n  Menunggu data daya\
      \ AC\n{% elif now_ts - last_cmd < 10 * 60 %}\n  Akan ke {{ rt }} °C · {{ rf }} (± {{ ((last_cmd\
      \ + 600 - now_ts) / 60) | round(0) | int }} mnt)\n{% elif states(u.last_applied) == rec %}\n  Terkirim,\
      \ belum sesuai\n{% else %}\n  Akan ke {{ rt }} °C · {{ rf }}\n{% endif %}"
  - name: AC LT1 Right status
    unique_id: ac_lt1_right_status
    default_entity_id: sensor.ac_lt1_right_status
    state: "{% set u = units.right %} {% set rec = states(u.setting) %} {% set rt = rec.split('|')[0]\
      \ | int(0) %} {% set rf = rec.split('|')[1] if '|' in rec else '' %} {% set t = state_attr(u.climate,\
      \ 'temperature') | int(0) %} {% set f = state_attr(u.climate, 'fan_mode') %} {% set now_ts = now().timestamp()\
      \ %} {% set manual_until = (state_attr(u.last_manual, 'timestamp') | float(0)) + 60 * 60 %} {% set\
      \ last_cmd = (state_attr(u.last_command, 'timestamp') | float(0)) %} {% if is_state(u.climate, 'off')\
      \ %}\n  AC mati, tidak diatur otomasi\n{% elif not is_state(u.climate, 'cool') %}\n  Mode bukan\
      \ Cool, tidak diatur otomasi\n{% elif rt == 0 or (rt == t and rf == f) %}\n  ok\n{% elif now_ts\
      \ < manual_until %}\n  Dijeda manual s/d {{ manual_until | timestamp_custom('%H:%M') }}\n{% elif\
      \ not is_state(u.switch, 'on') %}\n  Otomasi mati · saran {{ rt }} °C · {{ rf }}\n{% elif not is_state('schedule.ac_lt1_hours',\
      \ 'on') %}\n  Di luar jam kerja\n{% elif not is_state('input_boolean.ac_adaptive_count_lt1_enabled',\
      \ 'on') %}\n  Hitung orang mati\n{% elif not is_state('binary_sensor.ac_lt1_occupied', 'on')\n \
      \       or is_state('binary_sensor.ac_lt1_count_stale', 'on') %}\n  Menunggu hitungan orang\n{%\
      \ elif not (has_value(u.power)\n             and states(u.power) | float(0) > 50\n             and\
      \ (now_ts - as_timestamp(states[u.power].last_reported, 0)) < 20 * 60) %}\n  Menunggu data daya\
      \ AC\n{% elif now_ts - last_cmd < 10 * 60 %}\n  Akan ke {{ rt }} °C · {{ rf }} (± {{ ((last_cmd\
      \ + 600 - now_ts) / 60) | round(0) | int }} mnt)\n{% elif states(u.last_applied) == rec %}\n  Terkirim,\
      \ belum sesuai\n{% else %}\n  Akan ke {{ rt }} °C · {{ rf }}\n{% endif %}"
- triggers:
  - trigger: state
    entity_id:
    - input_text.ac_lt1_left_last_applied
    - input_text.ac_lt1_right_last_applied
    id: applied
  - trigger: state
    entity_id:
    - input_boolean.ac_lt1_left_control_enabled
    - input_boolean.ac_lt1_right_control_enabled
    id: control
  - trigger: state
    entity_id: sensor.ac_lt1_people
    id: people
  - trigger: state
    entity_id: input_datetime.ac_lt1_count_time
    id: people
  variables:
    day: '{{ now().strftime(''%Y-%m-%d'') }}'
    cutoff: '{{ (now() - timedelta(days=6)).strftime(''%Y-%m-%d'') }}'
    unit: '{{ trigger.entity_id.split(''.'')[1].split(''_'')[2] }}'
    new_state: '{{ trigger.to_state.state if trigger.to_state is not none else '''' }}'
    old_state: '{{ trigger.from_state.state if trigger.from_state is not none else '''' }}'
    kind: '{% if trigger.id == ''applied'' and ''|'' in new_state and new_state != old_state %}sent {%-
      elif trigger.id == ''applied'' and new_state == ''manual change'' and old_state != new_state %}manual
      {%- elif trigger.id == ''control'' and new_state in [''on'', ''off''] and old_state in [''on'',
      ''off''] %}control {%- else %}none{% endif %}'
    old_events: '{{ state_attr(''sensor.ac_lt1_activity'', ''events'') or [] }}'
    old_sent: '{{ state_attr(''sensor.ac_lt1_activity'', ''sent_by_day'') or {} }}'
    old_peak: '{{ state_attr(''sensor.ac_lt1_activity'', ''people_peak_by_day'') or {} }}'
  sensor:
  - name: AC LT1 Activity
    unique_id: ac_lt1_activity
    default_entity_id: sensor.ac_lt1_activity
    state: '{% set cur = old_sent.get(day, {}) %} {% set extra = 1 if kind == ''sent'' else 0 %} {{ (cur.values()
      | map(''int'', 0) | sum) + extra }}'
    attributes:
      events: "{% if kind == 'none' %}\n  {{ old_events }}\n{% else %}\n  {% set e = {'unit': unit, 'kind':\
        \ kind, 'value': new_state,\n              'ts': now().timestamp() | int, 'time': now().strftime('%H:%M:%S'),\
        \ 'day': day} %}\n  {{ ([e] + old_events)[:8] }}\n{% endif %}"
      sent_by_day: "{% set ns = namespace(r={}) %} {% set cur = old_sent.get(day, {}) %} {% if kind ==\
        \ 'sent' %}\n  {% set cur = cur | combine({unit: (cur.get(unit, 0) | int(0)) + 1}) %}\n{% endif\
        \ %} {% set merged = old_sent | combine({day: cur}) %} {% for k, v in merged.items() if k >= cutoff\
        \ %}\n  {% set ns.r = ns.r | combine({k: v}) %}\n{% endfor %} {{ ns.r }}"
      people_peak_by_day: "{% set ns = namespace(r={}) %} {# Count a day's peak only inside the work-hours\
        \ schedule and with a fresh count. Outside\n   it sensor.ac_lt1_people can show the last count\
        \ again whenever Frigate sees someone\n   (Saturday 2026-10-31 showed 1). Which days count is\
        \ decided only by the schedule. #}\n{# Freshness is computed here (same 30 minutes as stale_minutes\
        \ in the count package), not\n   read from binary_sensor.ac_lt1_count_stale, whose update order\
        \ versus this trigger\n   is not guaranteed. #}\n{% set age = (now().timestamp()\n           \
        \   - (state_attr('input_datetime.ac_lt1_count_time', 'timestamp') | float(0))) / 60 %}\n{% set\
        \ counted = is_state('schedule.ac_lt1_hours', 'on') and age <= 30 %} {% set now_people = (states('sensor.ac_lt1_people')\
        \ | int(0)) if counted else 0 %} {% set merged = old_peak | combine({day: [old_peak.get(day, 0)\
        \ | int(0), now_people] | max}) %} {% for k, v in merged.items() if k >= cutoff %}\n  {% set ns.r\
        \ = ns.r | combine({k: v}) %}\n{% endfor %} {{ ns.r }}"
input_number:
  ac_lt1_left_changes:
    name: AC LT1 Left changes today
    icon: mdi:counter
    min: 0
    max: 999
    step: 1
    mode: box
  ac_lt1_right_changes:
    name: AC LT1 Right changes today
    icon: mdi:counter
    min: 0
    max: 999
    step: 1
    mode: box
script:
  ac_lt1_apply_setting:
    alias: AC LT1 - apply setting to one AC
    mode: parallel
    max: 10
    fields:
      ac_climate:
        description: Climate entity of the unit
      ac_power:
        description: Power sensor of the unit
      ac_control_switch:
        description: input_boolean that authorises this unit
      ac_last_command:
        description: input_datetime of the last attempt
      ac_last_manual:
        description: input_datetime of the last HA user change
      ac_last_applied:
        description: input_text with the last attempted setting
      ac_setting:
        description: sensor with the target as <temperature>|<fan>
      ac_min_temp:
        description: Lowest setpoint of the unit
      ac_max_temp:
        description: Highest setpoint of the unit
    sequence:
    - variables:
        target_setting: '{{ states(ac_setting) }}'
        target_temperature: '{{ target_setting.split(''|'')[0] | int(0) }}'
        target_fan: '{{ target_setting.split(''|'')[1] if ''|'' in target_setting else '''' }}'
    - condition: template
      value_template: '{{ is_state(ac_control_switch, ''on'') }}'
    - condition: state
      entity_id: input_boolean.ac_adaptive_count_lt1_enabled
      state: 'on'
    - condition: state
      entity_id: schedule.ac_lt1_hours
      state: 'on'
    - condition: state
      entity_id: binary_sensor.ac_lt1_occupied
      state: 'on'
    - condition: state
      entity_id: binary_sensor.ac_lt1_count_stale
      state: 'off'
    - condition: template
      value_template: '{{ states(ac_power) | float(0) > 50 }}'
    - condition: template
      value_template: "{{ has_value(ac_power)\n   and (now().timestamp()\n        - as_timestamp(states[ac_power].last_reported,\
        \ 0)) < 20 * 60 }}"
    - condition: template
      value_template: "{{ is_state(ac_climate, 'cool')\n   and ac_min_temp <= target_temperature | int(0)\
        \ <= ac_max_temp\n   and target_fan in (state_attr(ac_climate, 'fan_modes') or []) }}"
    - condition: template
      value_template: "{{ now().timestamp()\n   - (state_attr(ac_last_command, 'timestamp') | float(0))\
        \ >= 10 * 60 }}"
    - condition: template
      value_template: "{{ now().timestamp()\n   - (state_attr(ac_last_manual, 'timestamp') | float(0))\
        \ >= 60 * 60 }}"
    - condition: template
      value_template: '{{ states(ac_last_applied) != target_setting }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ ac_last_command }}'
      data:
        timestamp: '{{ now().timestamp() | int }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ ac_last_applied }}'
      data:
        value: '{{ target_setting }}'
    - action: climate.set_temperature
      target:
        entity_id: '{{ ac_climate }}'
      data:
        temperature: '{{ target_temperature }}'
    - condition: template
      value_template: '{{ is_state(ac_control_switch, ''on'') }}'
    - action: climate.set_fan_mode
      target:
        entity_id: '{{ ac_climate }}'
      data:
        fan_mode: '{{ target_fan }}'
automation:
- id: ac_lt1_arm
  alias: AC floor 1 - arm the two units
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.ac_lt1_left_control_enabled
    - input_boolean.ac_lt1_right_control_enabled
    to: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.ac_lt1_left_control_enabled'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.ac_lt1_left_last_applied
        data:
          value: armed
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.ac_lt1_right_control_enabled'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.ac_lt1_right_last_applied
        data:
          value: armed
- id: ac_lt1_manual_pause
  alias: AC floor 1 - record HA manual change
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - climate.ac_lg_lt_1_kiri
    - climate.ac_lg_lt_1_kanan
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none\n   and trigger.to_state.context.user_id is not none\n\
      \   and trigger.to_state.context.parent_id is none\n   and (trigger.from_state is none\n       \
      \ or trigger.from_state.state != trigger.to_state.state\n        or trigger.from_state.attributes.get('temperature')\
      \ != trigger.to_state.attributes.get('temperature')\n        or trigger.from_state.attributes.get('fan_mode')\
      \ != trigger.to_state.attributes.get('fan_mode')) }}"
  actions:
  - variables:
      unit: "{{ {'climate.ac_lg_lt_1_kiri': 'left',\n    'climate.ac_lg_lt_1_kanan': 'right'}[trigger.entity_id]\
        \ }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.ac_lt1_{{ unit }}_last_manual
    data:
      timestamp: '{{ now().timestamp() | int }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.ac_lt1_{{ unit }}_control_enabled
  - action: input_text.set_value
    target:
      entity_id: input_text.ac_lt1_{{ unit }}_last_applied
    data:
      value: manual change
- id: ac_lt1_manual_resume
  alias: AC floor 1 - resume control 60 minutes after a manual change
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: schedule.ac_lt1_hours
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: "{{ is_state('input_boolean.ac_lt1_left_control_enabled', 'off')\n   and is_state('input_text.ac_lt1_left_last_applied',\
        \ 'manual change')\n   and now().timestamp()\n       - (state_attr('input_datetime.ac_lt1_left_last_manual',\
        \ 'timestamp') | float(0))\n       >= 60 * 60 }}"
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ac_lt1_left_control_enabled
  - if:
    - condition: template
      value_template: "{{ is_state('input_boolean.ac_lt1_right_control_enabled', 'off')\n   and is_state('input_text.ac_lt1_right_last_applied',\
        \ 'manual change')\n   and now().timestamp()\n       - (state_attr('input_datetime.ac_lt1_right_last_manual',\
        \ 'timestamp') | float(0))\n       >= 60 * 60 }}"
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ac_lt1_right_control_enabled
- id: ac_lt1_left_apply
  alias: AC floor 1 left - apply people-based setting
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id: sensor.ac_lt1_left_recommended_setting
  - trigger: state
    entity_id: sensor.0x60b763fffe1e5fc6_power
  - trigger: state
    entity_id: input_boolean.ac_lt1_left_control_enabled
    to: 'on'
  - trigger: state
    entity_id: input_text.ac_lt1_left_last_applied
    to: armed
  actions:
  - action: script.ac_lt1_apply_setting
    data:
      ac_climate: climate.ac_lg_lt_1_kiri
      ac_power: sensor.0x60b763fffe1e5fc6_power
      ac_control_switch: input_boolean.ac_lt1_left_control_enabled
      ac_last_command: input_datetime.ac_lt1_left_last_command
      ac_last_manual: input_datetime.ac_lt1_left_last_manual
      ac_last_applied: input_text.ac_lt1_left_last_applied
      ac_setting: sensor.ac_lt1_left_recommended_setting
      ac_min_temp: 16
      ac_max_temp: 30
- id: ac_lt1_right_apply
  alias: AC floor 1 right - apply people-based setting
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id: sensor.ac_lt1_right_recommended_setting
  - trigger: state
    entity_id: sensor.0x60b763fffe1e380d_power
  - trigger: state
    entity_id: input_boolean.ac_lt1_right_control_enabled
    to: 'on'
  - trigger: state
    entity_id: input_text.ac_lt1_right_last_applied
    to: armed
  actions:
  - action: script.ac_lt1_apply_setting
    data:
      ac_climate: climate.ac_lg_lt_1_kanan
      ac_power: sensor.0x60b763fffe1e380d_power
      ac_control_switch: input_boolean.ac_lt1_right_control_enabled
      ac_last_command: input_datetime.ac_lt1_right_last_command
      ac_last_manual: input_datetime.ac_lt1_right_last_manual
      ac_last_applied: input_text.ac_lt1_right_last_applied
      ac_setting: sensor.ac_lt1_right_recommended_setting
      ac_min_temp: 16
      ac_max_temp: 30
- id: ac_lt1_check_power
  alias: AC floor 1 - check power after command
  mode: parallel
  max: 10
  triggers:
  - trigger: state
    entity_id:
    - input_datetime.ac_lt1_left_last_command
    - input_datetime.ac_lt1_right_last_command
  actions:
  - variables:
      unit: "{{ {'input_datetime.ac_lt1_left_last_command': 'left',\n    'input_datetime.ac_lt1_right_last_command':\
        \ 'right'}[trigger.entity_id] }}"
      power_sensor: "{{ {'left': 'sensor.0x60b763fffe1e5fc6_power',\n    'right': 'sensor.0x60b763fffe1e380d_power'}[unit]\
        \ }}"
  - delay:
      minutes: 15
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ac_lt1_'' ~ unit ~ ''_control_enabled'', ''on'') }}'
    - condition: template
      value_template: '{{ states(''input_datetime.ac_lt1_'' ~ unit ~ ''_last_command'') not in (''unknown'',
        ''unavailable'') }}'
    - condition: template
      value_template: "{{ has_value(power_sensor)\n   and (now().timestamp()\n        - as_timestamp(states[power_sensor].last_reported,\
        \ 0)) < 20 * 60\n   and states(power_sensor) | float(0) <= 50 }}"
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ac_lt1_{{ unit }}_control_enabled
    - action: persistent_notification.create
      data:
        title: 'AC floor 1 {{ unit }}: automatic control paused'
        message: A fresh power report is below 50 W 15 minutes after an automatic command. Check the physical
          AC before enabling control again.
- id: ac_lt1_notify_setting_sent
  alias: AC LT1 - notify when a setting is sent
  mode: queued
  variables:
    notify_service: notify.mobile_app_cph2457
    dashboard_path: /ac-adaptive-lt2/lantai-1
  triggers:
  - trigger: state
    entity_id:
    - input_text.ac_lt1_left_last_applied
    - input_text.ac_lt1_right_last_applied
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none\n   and '|' in trigger.to_state.state\n   and (trigger.from_state\
      \ is none or trigger.from_state.state != trigger.to_state.state)\n   and trigger.to_state.context.user_id\
      \ is none }}"
  actions:
  - variables:
      unit: "{{ {'input_text.ac_lt1_left_last_applied': 'left',\n    'input_text.ac_lt1_right_last_applied':\
        \ 'right'}[trigger.entity_id] }}"
      ac_name: '{{ {''left'': ''LG Kiri'', ''right'': ''LG Kanan''}[unit] }}'
      temperature: '{{ trigger.to_state.state.split(''|'')[0] }}'
      fan: '{{ trigger.to_state.state.split(''|'')[1] }}'
  - action: input_number.increment
    target:
      entity_id: input_number.ac_lt1_{{ unit }}_changes
  - action: '{{ notify_service }}'
    continue_on_error: true
    data:
      title: 'AC {{ ac_name }}: {{ temperature }} °C · Fan {{ fan }}'
      message: Setelan dikirim pukul {{ now().strftime('%H:%M') }} untuk {{ states('sensor.ac_lt1_people')
        | int(0) }} orang di Lantai 1.
      data:
        tag: ac_lt1_{{ unit }}
        clickAction: '{{ dashboard_path }}'
        url: '{{ dashboard_path }}'
  - action: persistent_notification.create
    continue_on_error: true
    data:
      notification_id: ac_lt1_{{ unit }}
      title: 'AC {{ ac_name }}: {{ temperature }} °C · Fan {{ fan }}'
      message: Setelan dikirim pukul {{ now().strftime('%H:%M') }} untuk {{ states('sensor.ac_lt1_people')
        | int(0) }} orang di Lantai 1.
- id: ac_lt1_daily_summary
  alias: AC LT1 - daily summary
  mode: single
  variables:
    notify_service: notify.mobile_app_cph2457
    dashboard_path: /ac-adaptive-lt2/lantai-1
  triggers:
  - trigger: state
    entity_id: schedule.ac_lt1_hours
    from: 'on'
    to: 'off'
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: input_boolean.ac_adaptive_count_lt1_enabled
    state: 'on'
  actions:
  - action: '{{ notify_service }}'
    continue_on_error: true
    data:
      title: 'AC Lantai 1: ringkasan hari ini'
      message: 'Setelan dikirim: Kiri {{ states(''input_number.ac_lt1_left_changes'') | int(0) }}x, Kanan
