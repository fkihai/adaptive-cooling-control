# Generated by tools/build_floor1_packages.py; edit LT2 rules or this builder.
input_boolean:
  ac_adaptive_count_lt1_enabled:
    name: AC LT1 Counting
    icon: mdi:account-group
input_number:
  ac_lt1_count_last:
    name: AC LT1 People (last)
    min: 0
    max: 50
    step: 1
    mode: box
  ac_lt1_count_prev:
    name: AC LT1 People (prev)
    min: 0
    max: 50
    step: 1
    mode: box
  ac_lt1_count_confidence:
    name: AC LT1 Confidence
    min: 0
    max: 100
    step: 1
    mode: box
input_datetime:
  ac_lt1_count_time:
    name: AC LT1 Counted at
    has_date: true
    has_time: true
input_text:
  ac_lt1_count_note:
    name: AC LT1 Note
    max: 255
schedule:
  ac_lt1_hours:
    name: AC LT1 Work hours
    monday:
    - from: 07:00:00
      to: '18:00:00'
    tuesday:
    - from: 07:00:00
      to: '18:00:00'
    wednesday:
    - from: 07:00:00
      to: '18:00:00'
    thursday:
    - from: 07:00:00
      to: '18:00:00'
    friday:
    - from: 07:00:00
      to: '18:00:00'
template:
- binary_sensor:
  - name: AC LT1 Occupied
    unique_id: ac_lt1_occupied
    default_entity_id: binary_sensor.ac_lt1_occupied
    device_class: occupancy
    state: '{{ is_state(''binary_sensor.1st_floor_person_occupancy'', ''on'') }}'
    delay_off:
      minutes: 15
- variables:
    ac_settings:
      left:
        entity_id: climate.ac_lg_lt_1_kiri
        few_max: 1
        normal_max: 3
        temperature:
        - 27
        - 22
        - 20
        - 18
        fan:
        - High
        - High
        - High
        - High
        min_temp: 16
        max_temp: 30
      right:
        entity_id: climate.ac_lg_lt_1_kanan
        few_max: 1
        normal_max: 3
        temperature:
        - 27
        - 22
        - 20
        - 18
        fan:
        - high
        - high
        - high
        - high
        min_temp: 16
        max_temp: 30
    stale_minutes: 30
    stale_level: 2
  binary_sensor:
  - name: AC LT1 Stale
    unique_id: ac_lt1_count_stale
    default_entity_id: binary_sensor.ac_lt1_count_stale
    state: "{{ is_state('binary_sensor.ac_lt1_occupied', 'on')\n   and ((now().timestamp()\n         -\
      \ (state_attr('input_datetime.ac_lt1_count_time', 'timestamp') | float(0))) / 60)\n       > stale_minutes\
      \ }}"
  sensor:
  - name: AC LT1 People
    unique_id: ac_lt1_people
    default_entity_id: sensor.ac_lt1_people
    unit_of_measurement: people
    state_class: measurement
    state: "{{ (states('input_number.ac_lt1_count_last') | int(0))\n   if is_state('binary_sensor.ac_lt1_occupied',\
      \ 'on') else 0 }}"
    attributes:
      last_count_age_minutes: "{{ ((now().timestamp()\n     - (state_attr('input_datetime.ac_lt1_count_time',\
        \ 'timestamp') | float(0))) / 60)\n   | round(0) }}"
  - name: AC LT1 Left level
    unique_id: ac_lt1_left_level
    default_entity_id: sensor.ac_lt1_left_level
    state: "{% set c = ac_settings.left %} {% set people = states('sensor.ac_lt1_people') | int(0) %}\
      \ {% if not is_state('binary_sensor.ac_lt1_occupied', 'on') %}\n  0\n{% elif is_state('binary_sensor.ac_lt1_count_stale',\
      \ 'on') %}\n  {{ stale_level }}\n{% elif people <= c.few_max %}\n  1\n{% elif people <= c.normal_max\
      \ %}\n  2\n{% else %}\n  3\n{% endif %}"
  - name: AC LT1 Left temp
    unique_id: ac_lt1_left_recommended_temperature
    default_entity_id: sensor.ac_lt1_left_recommended_temperature
    unit_of_measurement: °C
    state: '{% set c = ac_settings.left %} {% set level = states(''sensor.ac_lt1_left_level'') | int(stale_level)
      %} {{ [[c.temperature[level], c.min_temp] | max, c.max_temp] | min }}'
    attributes:
      level_name: '{{ [''empty'', ''few'', ''normal'', ''busy''][states(''sensor.ac_lt1_left_level'')
        | int(stale_level)] }}'
  - name: AC LT1 Left fan
    unique_id: ac_lt1_left_recommended_fan
    default_entity_id: sensor.ac_lt1_left_recommended_fan
    state: '{{ ac_settings.left.fan[states(''sensor.ac_lt1_left_level'') | int(stale_level)] }}'
  - name: AC LT1 Left target
    unique_id: ac_lt1_left_recommended_setting
    default_entity_id: sensor.ac_lt1_left_recommended_setting
    state: "{% set c = ac_settings.left %} {% set people = states('sensor.ac_lt1_people') | int(0) %}\
      \ {% if not is_state('binary_sensor.ac_lt1_occupied', 'on') %}\n  {% set level = 0 %}\n{% elif is_state('binary_sensor.ac_lt1_count_stale',\
      \ 'on') %}\n  {% set level = stale_level %}\n{% elif people <= c.few_max %}\n  {% set level = 1\
      \ %}\n{% elif people <= c.normal_max %}\n  {% set level = 2 %}\n{% else %}\n  {% set level = 3 %}\n\
      {% endif %} {{ [[c.temperature[level], c.min_temp] | max, c.max_temp] | min }}|{{ c.fan[level] }}"
  - name: AC LT1 Right level
    unique_id: ac_lt1_right_level
    default_entity_id: sensor.ac_lt1_right_level
    state: "{% set c = ac_settings.right %} {% set people = states('sensor.ac_lt1_people') | int(0) %}\
      \ {% if not is_state('binary_sensor.ac_lt1_occupied', 'on') %}\n  0\n{% elif is_state('binary_sensor.ac_lt1_count_stale',\
      \ 'on') %}\n  {{ stale_level }}\n{% elif people <= c.few_max %}\n  1\n{% elif people <= c.normal_max\
      \ %}\n  2\n{% else %}\n  3\n{% endif %}"
  - name: AC LT1 Right temp
    unique_id: ac_lt1_right_recommended_temperature
    default_entity_id: sensor.ac_lt1_right_recommended_temperature
    unit_of_measurement: °C
    state: '{% set c = ac_settings.right %} {% set level = states(''sensor.ac_lt1_right_level'') | int(stale_level)
      %} {{ [[c.temperature[level], c.min_temp] | max, c.max_temp] | min }}'
    attributes:
      level_name: '{{ [''empty'', ''few'', ''normal'', ''busy''][states(''sensor.ac_lt1_right_level'')
        | int(stale_level)] }}'
  - name: AC LT1 Right fan
    unique_id: ac_lt1_right_recommended_fan
    default_entity_id: sensor.ac_lt1_right_recommended_fan
    state: '{{ ac_settings.right.fan[states(''sensor.ac_lt1_right_level'') | int(stale_level)] }}'
  - name: AC LT1 Right target
    unique_id: ac_lt1_right_recommended_setting
    default_entity_id: sensor.ac_lt1_right_recommended_setting
    state: "{% set c = ac_settings.right %} {% set people = states('sensor.ac_lt1_people') | int(0) %}\
      \ {% if not is_state('binary_sensor.ac_lt1_occupied', 'on') %}\n  {% set level = 0 %}\n{% elif is_state('binary_sensor.ac_lt1_count_stale',\
      \ 'on') %}\n  {% set level = stale_level %}\n{% elif people <= c.few_max %}\n  {% set level = 1\
      \ %}\n{% elif people <= c.normal_max %}\n  {% set level = 2 %}\n{% else %}\n  {% set level = 3 %}\n\
      {% endif %} {{ [[c.temperature[level], c.min_temp] | max, c.max_temp] | min }}|{{ c.fan[level] }}"
automation:
- id: ac_adaptive_count_people_lt1
  alias: AC adaptive - count people floor 1
  mode: single
  max_exceeded: silent
  variables:
    ai_task_entity: ai_task.google_ai_task
    camera_entity: camera.1st_floor
    min_confidence: 70
    min_gap_minutes: 4
  triggers:
  - trigger: time_pattern
    minutes: 5
  - trigger: time_pattern
    minutes: 15
  - trigger: time_pattern
    minutes: 25
  - trigger: time_pattern
    minutes: 35
  - trigger: time_pattern
    minutes: 45
  - trigger: time_pattern
    minutes: 55
  - trigger: state
    entity_id: binary_sensor.ac_lt1_occupied
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.ac_adaptive_count_lt1_enabled
    state: 'on'
  - condition: state
    entity_id: schedule.ac_lt1_hours
    state: 'on'
  - condition: state
    entity_id: binary_sensor.ac_lt1_occupied
    state: 'on'
  - condition: template
    value_template: "{{ (now().timestamp()\n    - (state_attr('input_datetime.ac_lt1_count_time', 'timestamp')\
      \ | float(0)))\n   > min_gap_minutes * 60 }}"
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    response_variable: result
    data:
      entity_id: '{{ ai_task_entity }}'
      task_name: ac_adaptive_count_lt1
      instructions: Count every person visible in this office camera image, including people seated at
        desks, partly hidden by furniture or far from the camera. Do not count reflections, posters or
        screens. Return the count, your confidence from 0 to 100, and one short sentence saying where
        the people are.
      structure:
        count:
          description: Number of people visible
          required: true
          selector:
            number:
              min: 0
              max: 50
        confidence:
          description: Confidence from 0 to 100
          required: true
          selector:
            number:
              min: 0
              max: 100
        observation:
          description: One short sentence about where the people are
          required: true
          selector:
            text: null
      attachments:
      - media_content_id: media-source://camera/{{ camera_entity }}
        media_content_type: image/jpeg
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ result is defined\n   and result.data is mapping\n   and result.data.count\
          \ is defined\n   and (result.data.confidence | float(0)) >= min_confidence\n   and not ((result.data.count\
          \ | int(0)) == 0\n             and is_state('binary_sensor.1st_floor_person_occupancy', 'on'))\
          \ }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ac_lt1_count_prev
        data:
          value: '{{ states(''input_number.ac_lt1_count_last'') | int(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.ac_lt1_count_confidence
        data:
          value: '{{ result.data.confidence | float(0) }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.ac_lt1_count_note
        data:
          value: '{{ (result.data.observation | default(''''))[:250] }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.ac_lt1_count_last
        data:
          value: '{{ [result.data.count | int(0), 50] | min }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ac_lt1_count_time
        data:
          timestamp: '{{ now().timestamp() | int }}'
